services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fluxo
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
    ports:
      - "5432:5432"
    volumes:
      - fluxo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fluxo-postgres:
